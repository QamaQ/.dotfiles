# =========================================================
# DISEÑO MODERNO Y LIMPIO PARA HYPRLOCK (Glassmorphism)
# =========================================================

# --- VARIABLES ---
$font = JetBrainsMono Nerd Font
$text = rgb(205, 214, 244)
$text_dark = rgb(166, 173, 200)
$accent = rgb(203, 166, 247)
$base = rgb(30, 30, 46)

# --- GENERAL ---
general {
    # disable_loading_bar = true
    hide_cursor = true
    # grace = 0
}

# --- FONDO (BACKGROUND) ---
background {
    monitor =
    # ¡CAMBIA ESTA RUTA POR TU FONDO DE PANTALLA REAL!
    # path = ~/.dotfiles/.wall/014.jpg
     path = screenshot
    # Efecto de cristal esmerilado
    blur_passes = 3
    blur_size = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- AVATAR DEL USUARIO ---
image {
    monitor =
    # ¡CAMBIA ESTA RUTA POR TU FOTO DE PERFIL! (Formato cuadrado/redondo)
    path = ~/.face 
    size = 120
    rounding = -1 # Hace que la imagen sea completamente circular
    border_size = 3
    border_color = $accent
    
    position = 0, 140
    halign = center
    valign = center
    
    # Sombra suave
    shadow_passes = 1
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.4)
}

# --- HORA ---
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $text
    font_size = 110
    font_family = $font
    
    position = 0, -10
    halign = center
    valign = center
    
    # Sombra para dar profundidad a los números
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# --- FECHA ---
label {
    monitor =
    text = cmd[update:43200000] echo "<b> $(date +"%A, %d de %B") </b>"
    color = $text_dark
    font_size = 20
    font_family = $font
    
    position = 0, -110
    halign = center
    valign = center
}

# --- CAMPO DE CONTRASEÑA (INPUT FIELD) ---
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    
    # Puntos de la contraseña
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    
    # Colores translúcidos para el efecto cristal
    outer_color = rgba(255, 255, 255, 0.05)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $text
    
    fade_on_empty = false
    
    # Texto de marcador de posición (Requiere Nerd Fonts)
    placeholder_text = <span foreground="##cba6f7">󰌾 </span> <span foreground="##a6adc8">Contraseña...</span>
    
    # Comportamiento
    hide_input = false
    check_color = $accent
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(249, 226, 175)
    
    position = 0, -210
    halign = center
    valign = center
    
    # Sombra de la caja
    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.3)
}
